name: Build APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: 'App name (Arabic allowed)'
        required: false
        default: 'تطبيق تجريبي'
      image_urls:
        description: 'Comma-separated public image URLs to bundle as drawables (optional)'
        required: false
        default: ''
      image_names:
        description: 'Comma-separated drawable file names matching image_urls, e.g. img_1.jpg,img_2.png (optional)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.14.3
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Download user images as drawables
        if: ${{ inputs.image_urls != '' }}
        run: |
          mkdir -p app/src/main/res/drawable
          IFS=',' read -ra URLS <<< "${{ inputs.image_urls }}"
          IFS=',' read -ra NAMES <<< "${{ inputs.image_names }}"
          for i in "${!URLS[@]}"; do
            echo "Downloading ${NAMES[$i]} from ${URLS[$i]}"
            curl -fL -o "app/src/main/res/drawable/${NAMES[$i]}" "${URLS[$i]}"
          done
          ls -la app/src/main/res/drawable/

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct-download release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Build ${{ github.ref_name }}" \
            --notes "Built from prompt by بوصلة التطبيقات." \
            app/build/outputs/apk/debug/app-debug.apk
